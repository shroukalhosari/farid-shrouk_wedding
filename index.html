<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fared & Shrouk Wedding</title>

    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;700&family=Cairo:wght@300;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background: #fff0f5;
            text-align: center;
            overflow-x: hidden;
        }

        /* شاشة البداية مع تأثير الفيد */
        #welcome {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 1s ease-in-out;
            opacity: 1;
        }

        #welcome h1 {
            font-size: 32px;
            color: maroon;
            line-height: 1.8;
            font-family: 'El Messiri', sans-serif;
            width: 90%;
            max-width: 800px;
        }

        /* العنوان */
        .header {
            font-size: clamp(35px, 8vw, 55px);
            color: maroon;
            margin-top: 30px;
            font-family: 'El Messiri', sans-serif;
            padding: 0 10px;
        }

        /* العداد */
        .count-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .box {
            background: white;
            width: 100px;
            height: 100px;
            border-radius: 20px;
            box-shadow: 0 0 10px #ddd;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .number {
            font-size: 26px;
            font-weight: bold;
            color: maroon;
        }

        .label {
            color: gray;
            margin-top: 5px;
            font-size: 14px;
        }

        /* الكروت */
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 50px;
            padding: 0 20px;
        }

        .card {
            background: white;
            width: 260px;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 0 10px #ddd;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px #ccc;
        }

        .title {
            color: maroon;
            font-size: 22px;
            font-weight: bold;
        }

        .date {
            margin-top: 10px;
            font-size: 18px;
            font-weight: 600;
        }

        .place {
            margin-top: 10px;
            color: gray;
        }

        /* الصورة */
        img {
            width: 90%;
            max-width: 320px;
            height: auto;
            margin-top: 50px;
            margin-bottom: 40px;
            border-radius: 20px;
            box-shadow: 0 0 15px #ccc;
        }

        /* ==================== تنسيقات التعليقات والموسيقى الجديدة ==================== */
        
        .comment-section {
            max-width: 500px;
            margin: 40px auto 60px auto;
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 0 15px #eee;
            width: 90%;
            box-sizing: border-box;
        }

        .comment-section h2 {
            font-family: 'El Messiri', sans-serif;
            color: maroon;
            margin-bottom: 20px;
            font-size: 26px;
        }

        .comment-form input, .comment-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            outline: none;
            text-align: right; /* لتسهيل الكتابة بالعربي والانجليزي */
        }

        .comment-form input:focus, .comment-form textarea:focus {
            border-color: maroon;
        }

        .comment-form button {
            background: maroon;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
            width: 100%;
        }

        .comment-form button:hover {
            background: #5c0000;
        }

        .comments-display {
            max-width: 500px;
            margin: 20px auto 80px auto;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .comment-box {
            background: white;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 0 10px #ddd;
            text-align: right; /* عرض الاسم والكومنت من اليمين بشكل منظم */
            animation: fadeInBox 0.5s ease;
        }

        .comment-user {
            font-weight: bold;
            color: maroon;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .comment-text {
            color: #444;
            font-size: 15px;
            word-wrap: break-word;
        }

        @keyframes fadeInBox {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <!-- شاشة الترحيب -->
    <div id="welcome">
        <h1>
            ولقد بنيت لك بين أضلعي منزلاً عسى المقام بالمقيم يليق، فمرحباً بك أولاً وثانياً، عمراً وأخيراً ♥️💍
        </h1>
    </div>

    <!-- عنصر الموسيقى الخفي -->
    <audio id="bg-music" src="Music.mp3" loop></audio>

    <!-- عنوان الصفحة -->
    <div class="header">
        Fared & Shrouk ♥️💍
    </div>

    <!-- العداد -->
    <div class="count-container" id="countdown-wrapper">
        <div class="box">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>
        <div class="box">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>
        <div class="box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>
        <div class="box">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>
    </div>

    <!-- الكروت -->
    <div class="container">
        <div class="card">
            <div class="title">Katb Ktab</div>
            <div class="date">25/6/2026</div>
            <div class="place">Elryan Hall</div>
        </div>
        <div class="card">
            <div class="title">Wedding Ceremony</div>
            <div class="date">29/6/2026</div>
            <div class="place">G-Marriott Hall</div>
        </div>
    </div>

    <!-- الصورة -->
    <img src="shrouk77.jpeg" alt="Fared and Shrouk">


    <!-- ==================== قسم التعليقات الجديد تحت الصورة ==================== -->

    <!-- صندوق إضافة الرسالة -->
    <div class="comment-section">
        <h2>A message with love ❤️</h2>
        <div class="comment-form">
            <input type="text" id="userName" placeholder="الاسم الأول..." required>
            <textarea id="userComment" rows="3" placeholder="اكتب مباركتك أو رسالتك هنا..." required></textarea>
            <button onclick="addComment()">إرسال الرسالة ✨</button>
        </div>
    </div>

    <!-- مكان عرض الرسائل المرسلة -->
    <div class="comments-display" id="commentsDisplay">
        <!-- التعليقات تظهر هنا برمجياً -->
    </div>


    <script>
        /* العد التنازلي المطور */
        var weddingDate = new Date("Jun 29, 2026 12:00:00").getTime();

        function updateCountdown() {
            var now = new Date().getTime();
            var distance = weddingDate - now;

            if (distance < 0) {
                document.getElementById("countdown-wrapper").innerHTML = "<h2 style='color: maroon; font-family: \"El Messiri\", sans-serif; font-size: 30px;'>Just Married! 💍✨</h2>";
                clearInterval(countdownInterval);
                return;
            }

            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;
        }

        updateCountdown();
        var countdownInterval = setInterval(updateCountdown, 1000);


        /* تشغيل الموسيقى والتحكم في شاشة البداية */
        var music = document.getElementById("bg-music");

        function startMusic() {
            music.play().catch(function(error) {
                console.log("المتصفح يمنع التشغيل التلقائي حتى يتفاعل المستخدم مع الصفحة.");
            });
        }

        // محاولة تشغيل الموسيقى عند أي ضغطة على الشاشة تحسباً لقيود المتصفح
        document.addEventListener('click', function() {
            startMusic();
        }, { once: true });

        setTimeout(function() {
            var welcomeScreen = document.getElementById("welcome");
            welcomeScreen.style.opacity = "0";
            
            // تشغيل الموسيقى فور انتهاء شاشة الترحيب
            startMusic();

            setTimeout(function() {
                welcomeScreen.style.display = "none";
            }, 1000);
            
        }, 5000);


        /* برمجية قسم التعليقات الجديد وربطه بذاكرة المتصفح الحية */
        
        // تحميل التعليقات المخزنة مسبقاً عند فتح الصفحة
        window.onload = function() {
            loadComments();
        };

        function addComment() {
            var nameInput = document.getElementById("userName");
            var commentInput = document.getElementById("userComment");

            var name = nameInput.value.trim();
            var comment = commentInput.value.trim();

            if (name === "" || comment === "") {
                alert("برجاء ملء خانة الاسم والتعليق أولاً 🤍");
                return;
            }

            var newComment = {
                username: name,
                text: comment
            };

            // جلب التعليقات القديمة وضغط الجديدة معها
            var commentsList = JSON.parse(localStorage.getItem("weddingComments")) || [];
            commentsList.push(newComment);

            // حفظ التحديث بذاكرة الجهاز
            localStorage.setItem("weddingComments", JSON.stringify(commentsList));

            // إعادة عرض التعليقات وتصفير الخانات
            loadComments();
            nameInput.value = "";
            commentInput.value = "";
        }

        function loadComments() {
            var commentsDisplay = document.getElementById("commentsDisplay");
            commentsDisplay.innerHTML = ""; // تنظيف المكان

            var commentsList = JSON.parse(localStorage.getItem("weddingComments")) || [];

            // عرض الرسائل من الأحدث للأقدم
            for (var i = commentsList.length - 1; i >= 0; i--) {
                var box = document.createElement("div");
                box.className = "comment-box";

                var userDiv = document.createElement("div");
                userDiv.className = "comment-user";
                userDiv.innerText = commentsList[i].username;

                var textDiv = document.createElement("div");
                textDiv.className = "comment-text";
                textDiv.innerText = commentsList[i].text;

                box.appendChild(userDiv);
                box.appendChild(textDiv);
                commentsDisplay.appendChild(box);
            }
        }
    </script>

</body>
</html>
