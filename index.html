<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cairo:wght@300;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Cairo', sans-serif;
    background:#fff0f5;
    text-align:center;
}

/* العنوان */
.header{
    font-family:'Great Vibes', cursive;
    font-size:50px;
    color:maroon;
    margin-top:20px;
}

/* العداد */
.count-container{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:20px;
    flex-wrap:wrap;
}

.box{
    background:white;
    width:120px;
    height:120px;
    border-radius:15px;
    box-shadow:0 0 10px #ddd;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.number{
    font-size:30px;
    font-weight:bold;
    color:maroon;
}

.label{
    font-size:14px;
    color:gray;
}

/* الكروت */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin-top:40px;
}

.card{
    background:white;
    width:250px;
    padding:20px;
    border-radius:20px;
    box-shadow:0 0 10px #ddd;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.title{
    color:maroon;
    font-size:20px;
    font-weight:bold;
}

.date{
    margin-top:10px;
    font-size:18px;
}

.place{
    margin-top:10px;
    color:gray;
}

img{
    margin-top:40px;
    width:300px;
    border-radius:20px;
    box-shadow:0 0 10px #ccc;
}

</style>
</head>

<body>

<!-- العنوان -->
<div class="header">
Fared & Shrouk ♥️💍
</div>

<!-- العداد -->
<div class="count-container">

    <div class="box">
        <div class="number" id="days">0</div>
        <div class="label">Days</div>
    </div>

    <div class="box">
        <div class="number" id="hours">0</div>
        <div class="label">Hours</div>
    </div>

    <div class="box">
        <div class="number" id="minutes">0</div>
        <div class="label">Minutes</div>
    </div>

    <div class="box">
        <div class="number" id="seconds">0</div>
        <div class="label">Seconds</div>
    </div>

</div>

<!-- الكروت -->
<div class="container">

    <div class="card">
        <div class="title">Katp ketap</div>
        <div class="date">25/6/2026</div>
        <div class="place">Elryan Hall</div>
    </div>

    <div class="card">
        <div class="title">Wedding Ceremony</div>
        <div class="date">29/6/2026</div>
        <div class="place">G-Marriott Hall</div>
    </div>

</div>

<!-- الصورة -->
<img src="shrouk77.jpeg">

<script>

var weddingDate = new Date("Jun 29, 2026 12:00:00").getTime();

setInterval(function(){

    var now = new Date().getTime();
    var distance = weddingDate - now;

    document.getElementById("days").innerHTML =
    Math.floor(distance / (1000 * 60 * 60 * 24));

    document.getElementById("hours").innerHTML =
    Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

    document.getElementById("minutes").innerHTML =
    Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

    document.getElementById("seconds").innerHTML =
    Math.floor((distance % (1000 * 60)) / 1000);

},1000);

</script>

</body>
</html>
